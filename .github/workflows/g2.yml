# G2（変異検出）。kura の裏の待ち行列に回す。
#
#     kuratsugi workflow-enqueue --file g2.yml --repo <このリポジトリ>
#
# ジョブは tests/mutation/<名前>.json と 1 対 1。結果は
# ~/.kuratsugi/runs/mcp-nim-sdk/<コミット>/g2.yml/<回>/files/<名前>.report.json に残る。
# 並列数は各設定で 0 とし、待ち行列が渡す KURATSUGI_PARALLELISM に任せる。

name: g2

on: push

jobs:
  auth_client:
    steps:
      - name: nim-muter auth_client
        run: |
          status=0
          ../nim-muter/bin/nim-muter run --config tests/mutation/auth_client.json || status=$?
          cp .nim-muter/auth_client/report.json "$KURATSUGI_RESULT_DIR/auth_client.report.json" || exit 1
          exit $status
  auth_oauth:
